<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Scott Hal Stephens</title>
  <script>
    // Private test page. The chosen candidate comes from ?c=N and its icon is
    // written into the head while the page loads, so the browser treats it as
    // the page's real favicon (changing it after load is unreliable).
    var C = [{"id": 1, "name": "Emerald, white box, bigger"}, {"id": 2, "name": "Emerald, white box, biggest"}, {"id": 3, "name": "Emerald, light box, bigger"}, {"id": 4, "name": "Emerald, light box, biggest"}, {"id": 5, "name": "Green + teal, white box, bigger"}, {"id": 6, "name": "Green + teal, white box, biggest"}, {"id": 7, "name": "Green + teal, light box, bigger"}, {"id": 8, "name": "Green + teal, light box, biggest"}, {"id": 9, "name": "Blue, white box, bigger"}, {"id": 10, "name": "Blue, white box, biggest"}, {"id": 11, "name": "Blue, light box, bigger"}, {"id": 12, "name": "Blue, light box, biggest"}];
    var cur = parseInt(new URLSearchParams(location.search).get("c"), 10);
    if (!(cur >= 0 && cur <= C.length)) cur = 1;
    if (cur === 0) {
      document.write('<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">');
    } else {
      document.write('<link rel="icon" type="image/png" sizes="64x64" href="logo-test/c' + cur + '.png"><link rel="icon" type="image/svg+xml" href="logo-test/c' + cur + '.svg">');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --night: #1b211d; --light: #f4f5f0; --dim: rgba(244, 245, 240, 0.7); --line: rgba(244, 245, 240, 0.16); }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--night); }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .panel {
      position: fixed; right: 16px; bottom: 16px; z-index: 2;
      width: min(360px, calc(100vw - 32px)); max-height: calc(100svh - 32px); overflow: auto;
      background: rgba(20, 25, 22, 0.92); color: var(--light);
      border: 1px solid var(--line); border-radius: 14px; padding: 16px;
      font-family: "Tinos", "Times New Roman", serif;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-weight: 400; font-size: 1.25rem; }
    .note { margin: 6px 0 14px; color: var(--dim); font-style: italic; font-size: 0.95rem; }
    .big { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
    .big > img { width: 96px; height: 96px; }
    .sizes { display: flex; gap: 10px; align-items: end; margin-top: 6px; }
    .sizes img:nth-child(1) { width: 32px; height: 32px; }
    .sizes img:nth-child(2) { width: 16px; height: 16px; }
    .label { font-size: 1.05rem; }
    .list { display: grid; gap: 6px; }
    a.opt, button {
      font: inherit; color: inherit; cursor: pointer; text-align: left; text-decoration: none;
      display: flex; align-items: center; gap: 12px;
      background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    a.opt:hover { background: rgba(244, 245, 240, 0.06); }
    a.opt[aria-current="true"] { border-color: var(--light); background: rgba(244, 245, 240, 0.1); }
    a.opt:focus-visible, button:focus-visible { outline: 2px solid var(--light); outline-offset: 2px; }
    .list img { width: 24px; height: 24px; flex: none; }
    .toggle { padding: 4px 10px; font-size: 0.9rem; }
    .panel.min .body { display: none; }
  </style>
</head>
<body>
  <iframe src="index.html" title="Homepage"></iframe>
  <div class="panel">
    <div class="head">
      <h2>Logo test</h2>
      <button class="toggle" type="button" aria-expanded="true">Hide</button>
    </div>
    <div class="body">
      <p class="note">Pick one and the page reloads with it as this tab's icon. Arrow keys step through them.</p>
      <div class="big"><img alt="" id="big"><div><div class="label" id="label"></div><div class="sizes"><img alt="" id="s32"><img alt="" id="s16"></div></div></div>
      <div class="list" role="list"></div>
    </div>
  </div>
  <script>
    var all = [{ id: 0, name: "Current (live) favicon" }].concat(C);
    function src(id) { return id === 0 ? "favicon.svg" : "logo-test/c" + id + ".svg"; }
    var list = document.querySelector(".list");
    all.forEach(function (c) {
      var a = document.createElement("a"); a.className = "opt"; a.href = "?c=" + c.id; a.setAttribute("role", "listitem");
      if (c.id === cur) a.setAttribute("aria-current", "true");
      var im = document.createElement("img"); im.alt = ""; im.src = src(c.id);
      a.appendChild(im); a.appendChild(document.createTextNode(c.name)); list.appendChild(a);
      if (c.id === cur) {
        ["big", "s32", "s16"].forEach(function (id) { document.getElementById(id).src = src(c.id); });
        document.getElementById("label").textContent = c.name;
      }
    });
    document.addEventListener("keydown", function (e) {
      var n = all.length, i = all.findIndex(function (c) { return c.id === cur; });
      if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); location.search = "?c=" + all[(i + 1) % n].id; }
      if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); location.search = "?c=" + all[(i - 1 + n) % n].id; }
    });
    var panel = document.querySelector(".panel"), tog = document.querySelector(".toggle");
    tog.addEventListener("click", function () {
      var min = panel.classList.toggle("min");
      tog.textContent = min ? "Show" : "Hide"; tog.setAttribute("aria-expanded", String(!min));
    });
  </script>
</body>
</html>
