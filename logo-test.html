  <style>
    /* Private test page: the real homepage underneath, a picker on top that
       swaps this tab's icon so candidates can be judged in a real browser. */
    :root { --night: #1b211d; --light: #f4f5f0; --dim: rgba(244, 245, 240, 0.7); --line: rgba(244, 245, 240, 0.16); }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--night); }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .panel {
      position: fixed; right: 16px; bottom: 16px; z-index: 2;
      width: min(360px, calc(100vw - 32px)); max-height: calc(100svh - 32px); overflow: auto;
      background: rgba(20, 25, 22, 0.92); color: var(--light);
      border: 1px solid var(--line); border-radius: 14px; padding: 16px;
      font-family: "Tinos", "Times New Roman", serif;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h2 { margin: 0; font-weight: 400; font-size: 1.25rem; }
    .note { margin: 6px 0 14px; color: var(--dim); font-style: italic; font-size: 0.95rem; }
    .big { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
    .big img { width: 96px; height: 96px; }
    .big .sizes { display: flex; gap: 10px; align-items: end; }
    .big .sizes img:nth-child(1) { width: 32px; height: 32px; }
    .big .sizes img:nth-child(2) { width: 16px; height: 16px; }
    .big .label { font-size: 1.05rem; }
    .list { display: grid; gap: 6px; }
    button {
      font: inherit; color: inherit; cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 12px;
      background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button:hover { background: rgba(244, 245, 240, 0.06); }
    button[aria-pressed="true"] { border-color: var(--light); background: rgba(244, 245, 240, 0.1); }
    button:focus-visible { outline: 2px solid var(--light); outline-offset: 2px; }
    .list img { width: 24px; height: 24px; flex: none; }
    .toggle { padding: 4px 10px; font-size: 0.9rem; }
    .panel.min .body { display: none; }
  </style>
</head>
