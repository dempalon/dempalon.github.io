<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scott Hal Stephens</title>
  <meta name="description" content="Scott Hal Stephens, mathematics student at Imperial College London.">
  <meta name="theme-color" content="#1b211d">
  <link rel="icon" type="image/png" href="brandlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #1b211d;
      --light: #f4f5f0;
      --dim: rgba(244, 245, 240, 0.78);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--night);
      color: var(--light);
      font-family: "Tinos", "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* One edge-to-edge photograph of the hills */
    .scenery div {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .scenery div.on { opacity: 1; }
    /* A soft shade from the lower left so the words stay readable on any photo */
    .scenery::after {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(17, 22, 19, 0.78) 0%, rgba(17, 22, 19, 0.25) 42%, rgba(17, 22, 19, 0.05) 70%),
        linear-gradient(to right, rgba(17, 22, 19, 0.35), rgba(17, 22, 19, 0) 60%);
    }

    main {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 2rem 3rem;
      padding: clamp(1.5rem, 5vw, 4.5rem);
    }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(3rem, 11vw, 8.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.25);
    }
    /* The emblem stands in for the o in Scott */
    .o {
      display: inline-block;
      width: 0.48em; height: 0.48em;
      margin: 0 0.015em 0 0.02em;
      vertical-align: -0.015em;
      border-radius: 50%;
      cursor: pointer;
      color: var(--light);
      overflow: visible;
      filter: drop-shadow(0 1px 10px rgba(0, 0, 0, 0.3));
    }
    .o polygon {
      transform-box: view-box;
      transform-origin: 0px 0px;
      transition: transform 1.5s cubic-bezier(.65, 0, .35, 1);
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .side { text-align: right; padding-bottom: 0.6rem; }
    .lines { position: relative; margin: 0; }
    .lines span {
      display: block;
      font-size: clamp(1.1rem, 1.7vw, 1.35rem);
      font-style: italic;
      color: var(--dim);
      transition: opacity 1s ease;
    }
    .lines .thought {
      position: absolute; right: 0; bottom: 0;
      opacity: 0; color: var(--light); white-space: nowrap;
    }
    .lines .thought i { font-style: italic; }
    .lines .thought small { font-size: 0.75em; opacity: 0.75; margin-left: 0.5em; font-style: normal; }
    .lines.thinking .usual { opacity: 0; }
    .lines.thinking .thought { opacity: 1; }
    .reach {
      margin: 0.8rem 0 0;
      font-size: clamp(1.05rem, 1.5vw, 1.25rem);
    }
    .reach a {
      color: var(--light);
      text-decoration: none;
      border-bottom: 1px solid rgba(244, 245, 240, 0.45);
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }
    .reach a:hover { border-bottom-color: var(--light); }
    a:focus-visible { outline: 2px solid var(--light); outline-offset: 4px; border-radius: 2px; }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; gap: 1.25rem; align-content: end; }
      .side { text-align: left; padding-bottom: 0; }
      .lines .thought { right: auto; left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scenery div { transition: none; }
      .o polygon, .lines span { transition: none; }
    }
  </style>
</head>

    <div class="side">
      <p class="lines" aria-live="polite">

      </p>

  </main>

  <script>
    (function () {
      var size = (Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1) > 1800) ? "lg" : "sm";
      var layer = document.createElement("div");
      document.querySelector(".scenery").appendChild(layer);
      var src = "images/hills-" + size + ".jpg", img = new Image();
      img.onload = function () {
        layer.style.backgroundImage = "url(" + src + ")";
        requestAnimationFrame(function () { layer.classList.add("on"); });
      };
      img.src = src;

      // Books that have shaped how I think. One appears per click; edit freely.
      var books = [
        ["Tao: The Watercourse Way", "Alan Watts"],
        ["The Wisdom of Insecurity", "Alan Watts"],
        ["The Book: On the Taboo Against Knowing Who You Are", "Alan Watts"],
        ["Four Thousand Weeks", "Oliver Burkeman"],
        ["Meditations for Mortals", "Oliver Burkeman"],
        ["The Anxious Generation", "Jonathan Haidt"],
        ["Jonathan Livingston Seagull", "Richard Bach"],
        ["The Old Man and the Sea", "Ernest Hemingway"],
        ["Siddhartha", "Hermann Hesse"]
      ];
      var b = Math.floor(Math.random() * books.length);
      var o = document.querySelector(".o"), lines = document.querySelector(".lines"),
          title = lines.querySelector(".thought i"), author = lines.querySelector(".thought small");
      var shapes = Array.prototype.slice.call(o.querySelectorAll("polygon"));
      var turns = shapes.map(function () { return 0; });
      o.addEventListener("click", function () {
        // Each polygon turns about its own centre by exactly one of its own sides,
        // triangle first, so the emblem settles back into its original form.
        shapes.forEach(function (p, k) {
          var n = +p.getAttribute("data-n"), c = p.getAttribute("data-c").split(" ");
          p.style.transformOrigin = c[0] + "px " + c[1] + "px";
          turns[k] += 360 / n;
          p.style.transitionDelay = (k * 28) + "ms";
          p.style.transform = "rotate(" + turns[k] + "deg)";
        });
        var showing = lines.classList.contains("thinking");
        if (!showing) {
          title.textContent = books[b][0];
          author.textContent = books[b][1];
          b = (b + 1) % books.length;
        }
        lines.classList.toggle("thinking", !showing);
      });
    })();
  </script>
