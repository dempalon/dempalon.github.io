<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scott Hal Stephens</title>
  <meta name="description" content="Scott Hal Stephens — Mathematics Student at Imperial College London.">

  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="brandlogo.png">

  <style>
    html {
      scroll-behavior: smooth;
    }

    :root {
      --bg: #fafafa;
      --text: #222;
      --accent: #0055bb;
      --border: #e0e0e0;
      --subtext: #666;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #e0e0e0;
        --accent: #66b2ff;
        --border: #333;
        --subtext: #aaa;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.65;
    }

    /* Pinned Logo in fixed top-left corner */
    .top-logo {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid var(--border);
      z-index: 100;
    }

    /* Centered Container Layout */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 4rem 1rem 2.5rem;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0 0 0.2rem 0;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 1.3rem;
      margin-bottom: 0.2rem;
    }

    .subtitle {
      color: var(--subtext);
      margin: 0;
      font-size: 1rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .section-desc {
      color: var(--subtext);
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
      margin-top: 0;
    }

    section {
      margin-top: 1.8rem;
    }

    /* Simplistic Card Layout */
    .simple-card {
      display: block;
      border: 1px solid var(--border);
      padding: 1.25rem 1.4rem;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.01);
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .simple-card:hover {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.02);
      text-decoration: none;
    }

    .simple-card h2 {
      margin: 0 0 0.2rem 0;
      font-size: 1.3rem;
      color: var(--text);
    }

    .simple-card .card-subtitle {
      font-size: 0.95rem;
      color: var(--subtext);
      margin: 0 0 0.5rem 0;
    }

    .simple-card p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text);
    }

    .simple-card .card-action {
      display: inline-block;
      margin-top: 0.6rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--accent);
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      color: var(--subtext);
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a {
      color: var(--subtext);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .top-logo {
        position: static;
        display: block;
        margin: 1.5rem auto 0;
      }

      .container {
        padding-top: 1rem;
      }
    }
  </style>
</head>

<body id="top">

  <!-- Logo pinned outside main text box -->
  <img src="brandlogo.png" alt="Scott Hal Stephens" class="top-logo" width="42" height="42">

  <div class="container">
    <header>
      <h1>Scott Hal Stephens</h1>
      <p class="subtitle">Mathematics Student at Imperial College London</p>
    </header>

    <section style="margin-top: 1.5rem;">
      <p>
        I am interested in the philosophy of life.
      </p>
    </section>

    <section>
      <h2>Contact</h2>
      <p>
        Email: <a href="mailto:scott@shstephens.com">scott@shstephens.com</a>
      </p>
    </section>

    <footer>
      <span>&copy; 2026 Scott Hal Stephens. All rights reserved.</span>
      <a href="#top">Back to top &uarr;</a>
    </footer>
  </div>

</body>

</html>
