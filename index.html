<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scott Hal Stephens</title>
  <meta name="description" content="Scott Hal Stephens, mathematics student at Imperial College London.">
  <meta name="theme-color" content="#1b211d">
  <link rel="icon" type="image/png" href="brandlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #1b211d;
      --light: #f4f5f0;
      --dim: rgba(244, 245, 240, 0.78);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--night);
      color: var(--light);
      font-family: "Tinos", "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* One edge-to-edge photograph of the hills */
    .scenery div {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .scenery div.on { opacity: 1; }
    /* A soft shade from the lower left so the words stay readable on any photo */
    .scenery::after {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(17, 22, 19, 0.78) 0%, rgba(17, 22, 19, 0.25) 42%, rgba(17, 22, 19, 0.05) 70%),
        linear-gradient(to right, rgba(17, 22, 19, 0.35), rgba(17, 22, 19, 0) 60%);
    }

    main {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 2rem 3rem;
      padding: clamp(1.5rem, 5vw, 4.5rem);
    }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(3rem, 11vw, 8.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.25);
    }
    /* The emblem stands in for the o in Scott. An invisible real "o" sits just
       before it, so the name still selects and copies as text. */
    .ch {
      display: inline-block;
      width: 0.52em;
      color: transparent;
      text-shadow: none;
    }
    .ch::selection { color: transparent; background: Highlight; }
    .o {
      display: inline-block;
      width: 0.48em; height: 0.48em;
      margin: 0 0.015em 0 -0.5em;
      position: relative;
      vertical-align: -0.015em;
      border-radius: 50%;
      cursor: pointer;
      color: var(--light);
      overflow: visible;
      filter: drop-shadow(0 1px 10px rgba(0, 0, 0, 0.3));
    }
    .o polygon {
      transform-box: view-box;
      transform-origin: 0px 0px;
      transition: transform 1.5s cubic-bezier(.65, 0, .35, 1);
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .side { text-align: right; padding-bottom: 0.6rem; }
    .lines { position: relative; margin: 0; }
    .lines span {
      display: block;
      font-size: clamp(1.1rem, 1.7vw, 1.35rem);
      font-style: italic;
      color: var(--dim);
      transition: opacity 1s ease;
    }
    .lines .thought {
      position: absolute; right: 0; bottom: 0;
      opacity: 0; color: var(--light); white-space: nowrap;
    }
    .lines .thought i { font-style: italic; }
    .lines .thought small { font-size: 0.75em; opacity: 0.75; margin-left: 0.5em; font-style: normal; }
    .lines.thinking .usual { opacity: 0; }
    .lines.thinking .thought { opacity: 1; }
    .reach {
      margin: 0.8rem 0 0;
      font-size: clamp(1.05rem, 1.5vw, 1.25rem);
    }
    .reach a {
      color: var(--light);
      text-decoration: none;
      border-bottom: 1px solid rgba(244, 245, 240, 0.45);
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }
    .reach a:hover { border-bottom-color: var(--light); }
    a:focus-visible { outline: 2px solid var(--light); outline-offset: 4px; border-radius: 2px; }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; gap: 1.25rem; align-content: end; }
      .side { text-align: left; padding-bottom: 0; }
      .lines .thought { right: auto; left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scenery div { transition: none; }
      .o polygon, .lines span { transition: none; }
    }
  </style>
</head>
<body>

  <div class="scenery" aria-hidden="true"></div>

  <main>
    <h1>Sc<span class="ch">o</span><svg class="o" aria-hidden="true" focusable="false" viewBox="-50 -50 100 100" ><circle r="47" fill="none" stroke="currentColor" stroke-width="1.8"/><g fill="none" stroke="currentColor" stroke-linejoin="round"><polygon data-n="3" data-c="20.96 12.10" points="40.70,23.50 20.96,-10.70 1.22,23.50" stroke-width="1.70"/><polygon data-n="4" data-c="17.35 10.01" points="40.70,23.50 30.83,-13.34 -6.01,-3.47 3.86,33.37" stroke-width="1.64"/><polygon data-n="5" data-c="14.38 8.30" points="40.70,23.50 36.97,-12.04 2.02,-19.47 -15.85,11.48 8.06,38.03" stroke-width="1.59"/><polygon data-n="6" data-c="11.79 6.81" points="40.70,23.50 40.70,-9.88 11.79,-26.57 -17.11,-9.88 -17.11,23.50 11.79,40.19" stroke-width="1.53"/><polygon data-n="7" data-c="9.47 5.47" points="40.70,23.50 43.04,-7.71 20.10,-29.00 -10.85,-24.33 -26.50,2.77 -15.06,31.91 14.84,41.13" stroke-width="1.48"/><polygon data-n="8" data-c="7.33 4.23" points="40.70,23.50 44.55,-5.74 26.60,-29.14 -2.64,-32.99 -26.04,-15.04 -29.89,14.21 -11.94,37.61 17.30,41.45" stroke-width="1.42"/><polygon data-n="9" data-c="5.34 3.08" points="40.70,23.50 45.55,-4.01 31.59,-28.20 5.34,-37.75 -20.91,-28.20 -34.88,-4.01 -30.03,23.50 -8.63,41.45 19.31,41.45" stroke-width="1.37"/><polygon data-n="10" data-c="3.47 2.00" points="40.70,23.50 46.23,-2.49 35.42,-26.77 12.41,-40.06 -14.02,-37.28 -33.77,-19.50 -39.30,6.50 -28.49,30.77 -5.47,44.06 20.95,41.28" stroke-width="1.31"/><polygon data-n="11" data-c="1.69 0.98" points="40.70,23.50 46.69,-1.17 38.39,-25.15 18.43,-40.84 -6.83,-43.26 -29.39,-31.63 -42.09,-9.64 -40.88,15.71 -26.15,36.39 -2.59,45.82 22.33,41.02" stroke-width="1.26"/><polygon data-n="12" data-c="-0.00 0.00" points="40.70,23.50 47.00,-0.00 40.70,-23.50 23.50,-40.70 0.00,-47.00 -23.50,-40.70 -40.70,-23.50 -47.00,-0.00 -40.70,23.50 -23.50,40.70 0.00,47.00 23.50,40.70" stroke-width="1.20"/></g></svg>tt Hal<br>Stephens</h1>
    <div class="side">
      <p class="lines" aria-live="polite">
        <span class="usual">Mathematics, Imperial College London</span>
        <span class="thought"><i></i><small></small></span>
      </p>
      <p class="reach"><a href="mailto:scott@shstephens.com">scott@shstephens.com</a></p>
    </div>
  </main>

  <script>
    (function () {
      var size = (Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1) > 1800) ? "lg" : "sm";
      var layer = document.createElement("div");
      document.querySelector(".scenery").appendChild(layer);
      var src = "images/hills-" + size + ".jpg", img = new Image();
      img.onload = function () {
        layer.style.backgroundImage = "url(" + src + ")";
        requestAnimationFrame(function () { layer.classList.add("on"); });
      };
      img.src = src;

      // Books that have shaped how I think. One appears per click; edit freely.
      var books = [
        ["Tao: The Watercourse Way", "Alan Watts"],
        ["The Wisdom of Insecurity", "Alan Watts"],
        ["The Book: On the Taboo Against Knowing Who You Are", "Alan Watts"],
        ["Four Thousand Weeks", "Oliver Burkeman"],
        ["Meditations for Mortals", "Oliver Burkeman"],
        ["The Anxious Generation", "Jonathan Haidt"],
        ["Jonathan Livingston Seagull", "Richard Bach"],
        ["The Old Man and the Sea", "Ernest Hemingway"],
        ["Siddhartha", "Hermann Hesse"]
      ];
      var b = Math.floor(Math.random() * books.length);
      var o = document.querySelector(".o"), lines = document.querySelector(".lines"),
          title = lines.querySelector(".thought i"), author = lines.querySelector(".thought small");
      var shapes = Array.prototype.slice.call(o.querySelectorAll("polygon"));
      var turns = shapes.map(function () { return 0; });
      o.addEventListener("click", function () {
        // Each polygon turns about its own centre by exactly one of its own sides,
        // triangle first, so the emblem settles back into its original form.
        shapes.forEach(function (p, k) {
          var n = +p.getAttribute("data-n"), c = p.getAttribute("data-c").split(" ");
          p.style.transformOrigin = c[0] + "px " + c[1] + "px";
          turns[k] += 360 / n;
          p.style.transitionDelay = (k * 28) + "ms";
          p.style.transform = "rotate(" + turns[k] + "deg)";
        });
        var showing = lines.classList.contains("thinking");
        if (!showing) {
          title.textContent = books[b][0];
          author.textContent = books[b][1];
          b = (b + 1) % books.length;
        }
        lines.classList.toggle("thinking", !showing);
      });
    })();
  </script>
</body>
</html>
