<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scott Hal Stephens</title>
  <meta name="description" content="Scott Hal Stephens — Mathematics Student at Imperial College London.">

  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="brandlogo.png">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    :root {
      --bg: #fafafa;
      --text: #171717;
      --subtext: #666666;
      --accent: #0055bb;
      --accent-hover: #003e8a;
      --border: #e5e5e5;
      --pill-bg: #f4f4f5;
      --pill-hover: #eaeaea;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1013;
        --text: #f0f0f2;
        --subtext: #9da3af;
        --accent: #58a6ff;
        --accent-hover: #79b8ff;
        --border: #22262e;
        --pill-bg: #181b22;
        --pill-hover: #222733;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Centered Container with vertical balance */
    .container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 5rem 1.5rem 2.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
    }

    /* Focal Point: Geometric Emblem in the Header */
    .emblem-wrapper {
      margin-bottom: 2rem;
      display: inline-block;
    }

    .emblem {
      width: 80px;
      height: 80px;
      display: block;
      border-radius: 50%;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      cursor: default;
    }

    .emblem:hover {
      transform: rotate(20deg) scale(1.04);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      .emblem:hover {
        box-shadow: 0 6px 28px rgba(0, 0, 0, 0.6);
      }
    }

    /* Typography */
    header {
      margin-bottom: 2.2rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.5rem);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin: 0 0 0.5rem 0;
      color: var(--text);
    }

    .subtitle {
      color: var(--subtext);
      font-size: 1.05rem;
      margin: 0;
      letter-spacing: -0.01em;
      font-weight: 400;
    }

    .statement {
      margin-top: 0;
      margin-bottom: 2.5rem;
    }

    .statement p {
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--text);
      margin: 0;
    }

    /* Contact Section */
    .contact-section {
      margin-top: 1rem;
    }

    .contact-label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--subtext);
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: block;
    }

    .contact-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1rem;
      background: var(--pill-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .contact-pill:hover {
      border-color: var(--accent);
      background: var(--pill-hover);
      color: var(--accent);
      text-decoration: none;
      transform: translateY(-1px);
    }

    .contact-pill svg {
      width: 17px;
      height: 17px;
      opacity: 0.7;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
    }

    .contact-pill:hover svg {
      opacity: 1;
    }

    /* Footer */
    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--subtext);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    footer a {
      color: var(--subtext);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* Mobile fine-tuning */
    @media (max-width: 600px) {
      .container {
        padding-top: 3.5rem;
      }
      
      .emblem {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="main-content">
      
      <!-- Focal Anchor: Geometric Emblem -->
      <div class="emblem-wrapper">
        <img src="brandlogo.png" alt="Geometric Emblem" class="emblem" width="80" height="80">
      </div>

      <header>
        <h1>Scott Hal Stephens</h1>
        <p class="subtitle">Mathematics Student at Imperial College London</p>
      </header>

      <div class="statement">
        <p>I am interested in the philosophy of life.</p>
      </div>

      <div class="contact-section">
        <span class="contact-label">Get in touch</span>
        <a href="mailto:scott@shstephens.com" class="contact-pill" id="contact-email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <span>scott@shstephens.com</span>
        </a>
      </div>

    </div>

    <footer>
      <span>&copy; 2026 Scott Hal Stephens</span>
    </footer>
  </div>

</body>

</html>
