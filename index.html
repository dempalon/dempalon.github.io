<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scott Hal Stephens</title>
  <meta name="description" content="Scott Hal Stephens, mathematics student at Imperial College London.">
  <meta name="theme-color" content="#1b211d">
  <link rel="icon" type="image/png" href="brandlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #1b211d;
      --light: #f4f5f0;
      --dim: rgba(244, 245, 240, 0.78);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--night);
      color: var(--light);
      font-family: "Newsreader", Georgia, "Times New Roman", serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* One edge-to-edge photograph, chosen to match the screen's orientation */
    .scenery div {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .scenery div.on { opacity: 1; }
    /* A soft shade from the lower left so the words stay readable on any photo */
    .scenery::after {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(17, 22, 19, 0.78) 0%, rgba(17, 22, 19, 0.25) 42%, rgba(17, 22, 19, 0.05) 70%),
        linear-gradient(to right, rgba(17, 22, 19, 0.35), rgba(17, 22, 19, 0) 60%),
        radial-gradient(circle at 100% 0%, rgba(17, 22, 19, 0.55), rgba(17, 22, 19, 0) 22rem);
    }

    main {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: clamp(1.5rem, 5vw, 4.5rem);
    }
    h1 {
      margin: 0;
      font-weight: 300;
      font-size: clamp(3rem, 11vw, 8.5rem);
      line-height: 0.92;
      letter-spacing: -0.035em;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.25);
    }
    .line {
      margin: 1.1rem 0 0;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      color: var(--dim);
      font-style: italic;
    }
    .reach {
      margin: 2.2rem 0 0;
      display: flex; flex-wrap: wrap; gap: 0.5rem 2rem;
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
    }
    .reach a {
      color: var(--light);
      text-decoration: none;
      border-bottom: 1px solid rgba(244, 245, 240, 0.45);
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }
    .reach a:hover { border-bottom-color: var(--light); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--light); outline-offset: 4px; border-radius: 2px; }

    /* The emblem, top right. Click it. */
    .mark {
      position: fixed; z-index: 2;
      top: clamp(1.25rem, 3vw, 2rem); right: clamp(1.25rem, 3vw, 2rem);
      width: 44px; height: 44px; padding: 0;
      border: 0; border-radius: 50%;
      background: none; cursor: pointer;
      opacity: 0.8; transition: opacity 0.3s ease, transform 0.8s cubic-bezier(.2,.7,.2,1);
    }
    .mark img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    .mark:hover { opacity: 1; }
    .mark.turned { transform: rotate(180deg); }
    .whisper {
      position: fixed; z-index: 2;
      top: calc(clamp(1.25rem, 3vw, 2rem) + 56px); right: clamp(1.25rem, 3vw, 2rem);
      margin: 0; max-width: 16rem; text-align: right;
      font-style: italic; font-size: 1.15rem; line-height: 1.35;
      color: var(--light);
      opacity: 0; transform: translateY(-4px);
      transition: opacity 1.2s ease, transform 1.2s ease;
      pointer-events: none;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.45);
    }
    .whisper small { display: block; font-size: 0.85rem; opacity: 0.75; margin-top: 0.3rem; }
    .whisper.show { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      .scenery div { transition: none; }
      .mark, .whisper { transition: none; }
    }
  </style>
</head>
<body>

  <div class="scenery" aria-hidden="true"></div>

  <button class="mark" type="button" aria-label="A small thought" aria-controls="whisper" aria-expanded="false">
    <img src="brandlogo.png" alt="">
  </button>
  <p class="whisper" id="whisper" role="status">This is it.<small>after Alan Watts</small></p>

  <main>
    <h1>Scott Hal<br>Stephens</h1>
    <p class="line">Mathematics, Imperial College London</p>
    <p class="reach">
      <a href="mailto:scott@shstephens.com">scott@shstephens.com</a>
    </p>
  </main>

  <script>
    (function () {
      // Landscape photos for landscape screens, portrait photos for portrait screens.
      // One photo per visit; if the screen is rotated, switch to one that fits.
      var sets = {
        landscape: ["hills", "pines", "bracken", "clouds"],
        portrait: ["london-plane-trees", "forest-track", "dog-walk"]
      };
      var size = (Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1) > 1800) ? "lg" : "sm";
      var stage = document.querySelector(".scenery");
      var layer = document.createElement("div");
      stage.appendChild(layer);
      var portraitQuery = window.matchMedia("(orientation: portrait)");
      var chosen = {};
      function show() {
        var shape = portraitQuery.matches ? "portrait" : "landscape";
        if (!chosen[shape]) {
          var list = sets[shape];
          chosen[shape] = list[Math.floor(Math.random() * list.length)];
        }
        var src = "images/" + chosen[shape] + "-" + size + ".jpg";
        var img = new Image();
        img.onload = function () {
          layer.classList.remove("on");
          layer.style.backgroundImage = "url(" + src + ")";
          requestAnimationFrame(function () { layer.classList.add("on"); });
        };
        img.src = src;
      }
      show();
      if (portraitQuery.addEventListener) portraitQuery.addEventListener("change", show);
      else portraitQuery.addListener(show);

      var mark = document.querySelector(".mark"), whisper = document.getElementById("whisper");
      mark.addEventListener("click", function () {
        var open = whisper.classList.toggle("show");
        mark.classList.toggle("turned", open);
        mark.setAttribute("aria-expanded", open);
      });
    })();
  </script>
</body>
</html>
