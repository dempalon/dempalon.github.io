<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scott Hal Stephens</title>
  <meta name="description" content="Scott Hal Stephens, mathematics student at Imperial College London.">
  <meta name="theme-color" content="#1b211d">
  <link rel="icon" type="image/png" href="brandlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #1b211d;
      --light: #f4f5f0;
      --dim: rgba(244, 245, 240, 0.78);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--night);
      color: var(--light);
      font-family: "Tinos", "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* One edge-to-edge photograph: the town on weekdays, the hills at weekends */
    .scenery div {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .scenery div.on { opacity: 1; }
    /* A soft shade from the lower left so the words stay readable on any photo */
    .scenery::after {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(17, 22, 19, 0.78) 0%, rgba(17, 22, 19, 0.25) 42%, rgba(17, 22, 19, 0.05) 70%),
        linear-gradient(to right, rgba(17, 22, 19, 0.35), rgba(17, 22, 19, 0) 60%);
    }

    main {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 2rem 3rem;
      padding: clamp(1.5rem, 5vw, 4.5rem);
    }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(3rem, 11vw, 8.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.25);
    }
    /* The emblem stands in for the o in Scott. An invisible real "o" sits just
       before it, so the name still selects and copies as text. */
    .ch {
      display: inline-block;
      width: 0.5em;
      letter-spacing: 0;
      color: transparent;
      text-shadow: none;
    }
    .ch::selection { color: transparent; background: Highlight; }
    .o {
      display: inline-block;
      width: 0.48em; height: 0.48em;
      margin: 0 0.01em 0 -0.49em;
      position: relative;
      vertical-align: -0.015em;
      border-radius: 50%;
      cursor: pointer;
      color: var(--light);
      overflow: visible;
      filter: drop-shadow(0 1px 10px rgba(0, 0, 0, 0.3));
    }
    .o polygon {
      transform-box: view-box;
      transform-origin: 0px 0px;
      transition: transform 1.5s cubic-bezier(.65, 0, .35, 1);
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .side { text-align: right; padding-bottom: 0.6rem; }
    /* Both lines share one grid cell, so a long book title can wrap
       onto a second line instead of running off a narrow screen */
    .lines { display: grid; margin: 0; }
    .lines span {
      display: block;
      grid-area: 1 / 1;
      align-self: end;
      font-size: clamp(1.1rem, 1.7vw, 1.35rem);
      font-style: italic;
      color: var(--dim);
      transition: opacity 1s ease;
    }
    .lines .thought {
      width: 0; min-width: 100%;   /* wraps within the column rather than widening it */
      opacity: 0; color: var(--light);
      text-wrap: balance;
    }
    .lines .thought small { white-space: nowrap; }
    .lines .thought i { font-style: italic; }
    .lines .thought small { font-size: 0.75em; opacity: 0.75; margin-left: 0.25em; font-style: normal; }
    /* Whichever line is faded out is also hidden, so it can't be selected */
    .lines .usual, .lines.thinking .thought {
      visibility: visible;
      transition: opacity 1s ease, visibility 0s linear 0s;
    }
    .lines .thought, .lines.thinking .usual {
      visibility: hidden;
      transition: opacity 1s ease, visibility 0s linear 1s;
    }
    .lines.thinking .usual { opacity: 0; }
    .lines.thinking .thought { opacity: 1; }
    .reach {
      margin: 0.8rem 0 0;
      font-size: clamp(1.05rem, 1.5vw, 1.25rem);
    }
    .reach a {
      color: var(--light);
      text-decoration: none;
      border-bottom: 1px solid rgba(244, 245, 240, 0.45);
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }
    .reach a:hover { border-bottom-color: var(--light); }
    a:focus-visible { outline: 2px solid var(--light); outline-offset: 4px; border-radius: 2px; }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; gap: 1.25rem; align-content: end; }
      .side { text-align: left; padding-bottom: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scenery div { transition: none; }
      .o polygon, .lines span { transition: none; }
    }
  </style>
</head>
<body>

  <div class="scenery" aria-hidden="true"></div>

  <main>
    <h1>Sc<span class="ch">o</span><svg class="o" aria-hidden="true" focusable="false" viewBox="-50 -50 100 100" ><path fill="currentColor" fill-rule="evenodd" d="M48.5,0 A48.5,48.5 0 1,0 -48.5,0 A48.5,48.5 0 1,0 48.5,0 Z M41.5,0 A41.5,45.0 0 1,0 -41.5,0 A41.5,45.0 0 1,0 41.5,0 Z"/><g fill="none" stroke="currentColor" stroke-linejoin="round"><polygon data-n="3" data-c="18.24 10.53" points="35.42,20.45 18.24,-9.31 1.06,20.45" stroke-width="1.70"/><polygon data-n="4" data-c="15.10 8.72" points="35.42,20.45 26.83,-11.61 -5.23,-3.02 3.36,29.04" stroke-width="1.64"/><polygon data-n="5" data-c="12.51 7.22" points="35.42,20.45 32.17,-10.48 1.75,-16.94 -13.79,9.99 7.01,33.10" stroke-width="1.59"/><polygon data-n="6" data-c="10.26 5.93" points="35.42,20.45 35.42,-8.60 10.26,-23.12 -14.89,-8.60 -14.89,20.45 10.26,34.97" stroke-width="1.53"/><polygon data-n="7" data-c="8.24 4.76" points="35.42,20.45 37.46,-6.71 17.49,-25.24 -9.44,-21.18 -23.06,2.41 -13.11,27.76 12.92,35.79" stroke-width="1.48"/><polygon data-n="8" data-c="6.38 3.68" points="35.42,20.45 38.77,-5.00 23.15,-25.36 -2.30,-28.71 -22.66,-13.08 -26.01,12.36 -10.39,32.72 15.06,36.07" stroke-width="1.42"/><polygon data-n="9" data-c="4.65 2.68" points="35.42,20.45 39.64,-3.49 27.49,-24.54 4.65,-32.85 -18.20,-24.54 -30.35,-3.49 -26.13,20.45 -7.51,36.07 16.80,36.07" stroke-width="1.37"/><polygon data-n="10" data-c="3.02 1.74" points="35.42,20.45 40.23,-2.17 30.82,-23.30 10.80,-34.86 -12.20,-32.44 -29.39,-16.97 -34.20,5.65 -24.79,26.78 -4.76,38.34 18.24,35.92" stroke-width="1.31"/><polygon data-n="11" data-c="1.47 0.85" points="35.42,20.45 40.63,-1.02 33.40,-21.89 16.04,-35.54 -5.95,-37.64 -25.58,-27.52 -36.62,-8.39 -35.57,13.67 -22.76,31.66 -2.25,39.87 19.43,35.69" stroke-width="1.26"/><polygon data-n="12" data-c="-0.00 0.00" points="35.42,20.45 40.90,-0.00 35.42,-20.45 20.45,-35.42 0.00,-40.90 -20.45,-35.42 -35.42,-20.45 -40.90,-0.00 -35.42,20.45 -20.45,35.42 0.00,40.90 20.45,35.42" stroke-width="1.20"/></g></svg>tt Hal<br>Stephens</h1>
    <div class="side">
      <p class="lines" aria-live="polite">
        <span class="usual">Mathematics, Imperial College London</span>
        <span class="thought"><i></i> <small></small></span>
      </p>
      <p class="reach"><a href="mailto:scott@shstephens.com">scott@shstephens.com</a></p>
    </div>
  </main>

  <script>
    (function () {
      // Weekdays (in the visitor's own time) show the town; weekends, the hills.
      // The town has a portrait version for upright screens.
      var size = (Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1) > 1800) ? "lg" : "sm";
      var day = new Date().getDay(), weekday = day >= 1 && day <= 5;
      var upright = window.matchMedia("(orientation: portrait)");
      var scenery = document.querySelector(".scenery"), current = null, shown = "";
      function show() {
        var name = !weekday ? "hills" : (upright.matches ? "town-portrait" : "town");
        var src = "images/" + name + "-" + size + ".jpg";
        if (src === shown) return;
        shown = src;
        var img = new Image();
        img.onload = function () {
          if (src !== shown) return;
          var layer = document.createElement("div"), old = current;
          layer.style.backgroundImage = "url(" + src + ")";
          scenery.appendChild(layer);
          current = layer;
          requestAnimationFrame(function () { requestAnimationFrame(function () {
            layer.classList.add("on");
            if (old) setTimeout(function () { old.remove(); }, 1300);
          }); });
        };
        img.src = src;
      }
      show();
      if (weekday) {
        if (upright.addEventListener) upright.addEventListener("change", show);
        else if (upright.addListener) upright.addListener(show);
      }

      // Books that have shaped how I think. One appears per click; edit freely.
      var books = [
        ["Tao: The Watercourse Way", "Alan Watts"],
        ["The Wisdom of Insecurity", "Alan Watts"],
        ["The Book: On the Taboo Against Knowing Who You Are", "Alan Watts"],
        ["Four Thousand Weeks", "Oliver Burkeman"],
        ["Meditations for Mortals", "Oliver Burkeman"],
        ["The Anxious Generation", "Jonathan Haidt"],
        ["Jonathan Livingston Seagull", "Richard Bach"],
        ["The Old Man and the Sea", "Ernest Hemingway"],
        ["Siddhartha", "Hermann Hesse"]
      ];
      var b = Math.floor(Math.random() * books.length);
      var o = document.querySelector(".o"), lines = document.querySelector(".lines"),
          title = lines.querySelector(".thought i"), author = lines.querySelector(".thought small");
      var shapes = Array.prototype.slice.call(o.querySelectorAll("polygon"));
      var turns = shapes.map(function () { return 0; });
      o.addEventListener("click", function () {
        // Each polygon turns about its own centre by exactly one of its own sides,
        // triangle first, so the emblem settles back into its original form.
        shapes.forEach(function (p, k) {
          var n = +p.getAttribute("data-n"), c = p.getAttribute("data-c").split(" ");
          p.style.transformOrigin = c[0] + "px " + c[1] + "px";
          turns[k] += 360 / n;
          p.style.transitionDelay = (k * 28) + "ms";
          p.style.transform = "rotate(" + turns[k] + "deg)";
        });
        var showing = lines.classList.contains("thinking");
        if (!showing) {
          title.textContent = books[b][0];
          author.textContent = books[b][1];
          b = (b + 1) % books.length;
        }
        lines.classList.toggle("thinking", !showing);
      });
    })();
  </script>
</body>
</html>
